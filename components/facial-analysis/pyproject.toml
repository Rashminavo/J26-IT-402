[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "j26-facial-analysis"
version = "0.1.0"
description = "J26-IT-402 facial emotion and micro-expression analysis component"
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy==2.2.6",
    "opencv-python==4.14.0.94"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]