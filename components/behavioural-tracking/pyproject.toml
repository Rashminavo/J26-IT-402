[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "j26-behavioural-tracking"
version = "0.1.0"
description = "J26-IT-402 behavioural tracking component"
requires-python = ">=3.10,<3.14"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]